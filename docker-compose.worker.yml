# The worker: the background processes queued and scheduled work needs
# (queue consumers, the scheduler, outbox delivery), in a container of its own,
# so it can be given resources and scaled apart from the web server:
# QUEUE_WORKER_REPLICAS in .env, then server:restart. bin/semitexa loads this file when EVENTS_ASYNC=1;
# server:stop stops it.
#
# It runs every line of `worker:processes`: what the installed packages need
# for their queued and scheduled work, such as queue:work for each queue,
# mail:work, media:work, scheduler:plan and scheduler:work, webhook:work. Each
# is started again after its pause when it exits. A queue or package added
# later is picked up by server:restart.
#
# The overlays point the app at their services (DB_HOST=mysql, ...). This file
# cannot name those services itself, because an overlay that is not loaded has
# none, so bin/semitexa writes the same values to var/run/worker.env, read
# last. Without it (a bare `docker compose`), the worker reads what the app
# reads from .env.default and .env, and nothing is blanked.
services:
  worker:
    build: .
    # A PID 1 that passes docker stop's TERM on, so the worker stops at once.
    init: true
    user: "${SEMITEXA_UID:-1000}:${SEMITEXA_GID:-1000}"
    environment:
      HOME: /var/www/html
    env_file:
      - path: .env.default
        required: true
      - path: .env
        required: false
      - path: var/run/worker.env
        required: false
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    deploy:
      replicas: ${QUEUE_WORKER_REPLICAS:-1}
    command:
      - sh
      - -c
      - |
        # Words are split, never globbed: worker:processes prints plain words.
        set -f
        trap 'trap - TERM INT; kill 0; exit 0' TERM INT
        # run <pause> <command...>: the command, started again <pause> s after it exits.
        run() {
          pause=$$1; shift
          while true; do
            php -d memory_limit=${PHP_MEMORY_LIMIT:-512M} vendor/bin/semitexa "$$@"
            echo "worker: $$* exited ($$?); again in $${pause}s" >&2
            sleep "$$pause"
          done
        }
        if ! processes=$$(php vendor/bin/semitexa worker:processes); then
          # A core without worker:processes, or one that could not list any.
          echo "worker: worker:processes failed; running queue:work on the default queue only (server:restart retries)" >&2
          processes='5 queue:work'
        fi
        started=0
        while read -r line; do
          [ -n "$$line" ] || continue
          set -- $$line
          ok=1
          case "$$1" in ''|*[!0-9]*) ok=0 ;; esac
          [ "$$#" -ge 2 ] || ok=0
          for word in "$$@"; do
            case "$$word" in *[!A-Za-z0-9._:/=-]*) ok=0 ;; esac
          done
          if [ "$$ok" = 0 ]; then
            echo "worker: skipped, not a '<pause> <command>' line: $$line" >&2
            continue
          fi
          run "$$@" &
          started=1
        done <<EOF
        $$processes
        EOF
        [ "$$started" = 1 ] || run 5 queue:work &
        wait
    # The app waits for the database, cache and broker it is given; the worker
    # needs the same ones, and the app is in every stack.
    depends_on:
      app:
        condition: service_started
