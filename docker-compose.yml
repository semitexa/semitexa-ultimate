# Minimal Semitexa app: PHP + Swoole in Docker.
# Start: bin/semitexa server:start | Stop: bin/semitexa server:stop
# Optional services are added automatically by bin/semitexa based on .env.default/.env:
#   DB_DRIVER=mysql → docker-compose.mysql.yml
#   REDIS_HOST set  → docker-compose.redis.yml
#   EVENTS_ASYNC=1  → docker-compose.nats.yml
services:
  app:
    build: .
    # The host user (exported by bin/semitexa), so files the server writes into
    # the bind-mounted project are the developer's whatever their uid. A bare
    # `docker compose up` keeps the image's own user (1000). HOME: a uid with
    # no account in the image would otherwise get '/', which it cannot write.
    user: "${SEMITEXA_UID:-1000}:${SEMITEXA_GID:-1000}"
    environment:
      HOME: /var/www/html
      # Agent presence (ai:agent, ai:orient): one store for every project on the
      # machine, so an agent started in another project that edits this one's
      # packages is seen here. bin/semitexa points the mount at ~/.semitexa/agents;
      # a bare `docker compose up` keeps the project's own var/ai-work/agents.
      SEMITEXA_AGENTS_DIR: /var/semitexa/agents
      SEMITEXA_HOST_PROJECT_ROOT: ${SEMITEXA_HOST_PROJECT_ROOT:-}
    env_file:
      - path: .env.default
        required: true
      - path: .env
        required: false
    volumes:
      - .:/var/www/html
      - ${SEMITEXA_AGENTS_HOST_DIR:-./var/ai-work/agents}:/var/semitexa/agents
    ports:
      # This machine only by default (tk-app-port-binds-every-interface): the shared router
      # reaches the app over the project's network. SWOOLE_BIND=0.0.0.0 in .env opens the
      # port to the network, e.g. to test on a phone.
      - "${SWOOLE_BIND:-127.0.0.1}:${SWOOLE_PORT:-8080}:${SWOOLE_PORT:-8080}"
    restart: unless-stopped
    # Docker kills the container 10 s after asking it to stop, which is as long
    # as a stopping worker waits for its requests (SWOOLE_MAX_WAIT_TIME, 10):
    # the kill landed on the master's shutdown and the last log lines and
    # shutdown hooks were lost. Raise both together.
    stop_grace_period: 30s
    # Blocking-I/O detection (Swoole >= 6.2 tracer): Off by default; opt in
    # per-environment via .env. When On, any internal call that blocks a
    # coroutine longer than the threshold (µs) prints a backtrace to stdout.
    command:
      - php
      - -d
      # A Swoole worker is long-lived and holds every open SSE session, its
      # queues and subscription state for the worker's whole life — unlike a
      # request-per-process SAPI where 128M is per request. At the default limit
      # the worker dies with exit 255 under load and every route it served
      # starts timing out, including ones unrelated to SSE.
      - memory_limit=${PHP_MEMORY_LIMIT:-512M}
      - -d
      - swoole.blocking_detection=${SWOOLE_BLOCKING_DETECTION:-Off}
      - -d
      - swoole.blocking_threshold=${SWOOLE_BLOCKING_THRESHOLD:-100000}
      - server.php
    depends_on:
      setup:
        condition: service_completed_successfully

  scheduler:
    build: .
    user: "${SEMITEXA_UID:-1000}:${SEMITEXA_GID:-1000}"
    environment:
      HOME: /var/www/html
    env_file:
      - path: .env.default
        required: true
      - path: .env
        required: false
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    profiles: ["demo"]
    command:
      - sh
      - -lc
      - |
        failure_count=0
        max_failures=5
        while true; do
          if php vendor/bin/semitexa demo:deferred-heartbeat >/dev/null; then
            failure_count=0
          else
            failure_count=$$((failure_count + 1))
            echo "scheduler heartbeat command failed ($$failure_count/$$max_failures)" >&2
            if [ "$$failure_count" -ge "$$max_failures" ]; then
              echo "scheduler heartbeat command failed $$max_failures times consecutively; exiting" >&2
              exit 1
            fi
          fi
          sleep 60
        done
    depends_on:
      setup:
        condition: service_completed_successfully

  setup:
    build: .
    user: root
    env_file:
      - path: .env.default
        required: true
      - path: .env
        required: false
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    # Bootstrap the project on first `docker compose up`: fetch the full
    # semitexa/ultimate skeleton via composer, install dependencies, and copy
    # the result into the bind mount while preserving installer-owned files
    # (Dockerfile, docker-compose*.yml, .env*, bin/semitexa). The marker file
    # at var/install/bootstrap-complete.json makes the run idempotent.
    command:
      - sh
      - -euc
      - |
        TARGET_DIR=/var/www/html
        TEMP_DIR=/tmp/semitexa-bootstrap
        MARKER_PATH="$$TARGET_DIR/var/install/bootstrap-complete.json"
        COPYING_PATH="$$TARGET_DIR/var/install/bootstrap-copying"
        LOG_PATH="$$TARGET_DIR/var/log/install-bootstrap.log"
        PACKAGE_NAME=semitexa/ultimate
        # Empty: the latest stable release. A version pins the install to that
        # release (SEMITEXA_ULTIMATE_VERSION in .env) — what an upgrade check
        # needs to begin from the release before the newest one.
        PACKAGE_VERSION="$${SEMITEXA_ULTIMATE_VERSION:-}"
        BOOTSTRAP_VERSION=1

        log() {
          mkdir -p "$$TARGET_DIR/var/log" 2>/dev/null || true
          ts="$$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '[%s] [BOOTSTRAP] %s\n' "$$ts" "$$*"
          printf '[%s] [BOOTSTRAP] %s\n' "$$ts" "$$*" >> "$$LOG_PATH" 2>/dev/null || true
        }
        fail() { log "ERROR: $$*"; rm -rf "$$TEMP_DIR"; exit 2; }
        write_marker() {
          mkdir -p "$$TARGET_DIR/var/install"
          printf '{\n  "status": "ok",\n  "installed_package": "%s",\n  "installed_at": "%s",\n  "bootstrap_version": %s\n}\n' \
            "$$PACKAGE_NAME" \
            "$$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$$BOOTSTRAP_VERSION" > "$$MARKER_PATH" \
            || fail "marker write failed"
          # Handed to the directory's owner: a root-owned var/install would
          # outlive the install until the next start.
          chown -R "$$(stat -c '%u:%g' "$$TARGET_DIR")" "$$TARGET_DIR/var/install" 2>/dev/null || true
        }

        [ -d "$$TARGET_DIR" ] || fail "$$TARGET_DIR does not exist"
        [ -w "$$TARGET_DIR" ] || fail "$$TARGET_DIR is not writable"
        for b in composer php cp mv rm mkdir date; do
          command -v "$$b" >/dev/null 2>&1 || fail "missing required binary: $$b"
        done
        # The first log line makes var/log, as root: what this run makes goes
        # to the directory's owner, and nothing that was there before it.
        made_here=''
        for d in var var/log; do
          [ -d "$$TARGET_DIR/$$d" ] || made_here="$$made_here $$d"
        done
        owner="$$(stat -c '%u:%g' "$$TARGET_DIR")"
        # On every way out, a failed install included: on the next start these
        # are no longer new, so a root-owned one would never be handed back.
        trap 'for d in $$made_here; do chown -R "$$owner" "$$TARGET_DIR/$$d" 2>/dev/null || true; done' EXIT

        # A project is already here: the skeleton never goes over it. A clone
        # has composer.json but no vendor/ (vendor/ is not committed), so only
        # its own dependencies are installed, in place; the skeleton is fetched
        # only into a directory without a composer.json. The marker used to
        # decide: a clone that carried it never got vendor/ (the app
        # crash-looped), and a project without it had the skeleton copied over
        # its composer.json, composer.lock and README. A skeleton copy cut off
        # midway (an interrupted container, a failed cp) also leaves a
        # composer.json: COPYING_PATH says so, and the bootstrap runs again.
        if [ -f "$$TARGET_DIR/composer.json" ] && [ ! -e "$$COPYING_PATH" ]; then
          if [ -f "$$TARGET_DIR/vendor/autoload.php" ]; then
            log "already bootstrapped: composer.json and vendor/ are here"
          else
            log "install this project's own dependencies (composer.json, no vendor/)"
            had_lock=0
            [ -f "$$TARGET_DIR/composer.lock" ] && had_lock=1
            # What the install wrote as root goes to the directory's owner,
            # a failed install included: a root-owned lock outlives the retry.
            hand_back() {
              chown -R "$$owner" "$$TARGET_DIR/vendor" 2>/dev/null || true
              [ "$$had_lock" = 1 ] || chown "$$owner" "$$TARGET_DIR/composer.lock" 2>/dev/null || true
            }
            if ! composer install --working-dir="$$TARGET_DIR" \
              --no-interaction --prefer-dist --optimize-autoloader; then
              # Composer writes the autoloader before the scripts that can fail
              # it: left behind, the next start would read the install as done.
              rm -f "$$TARGET_DIR/vendor/autoload.php"
              hand_back
              fail "composer install failed"
            fi
            hand_back
          fi
          [ -f "$$MARKER_PATH" ] || write_marker
          exit 0
        fi

        rm -rf "$$TEMP_DIR"

        log "step 1/6 create project skeleton ($${PACKAGE_VERSION:-latest stable})"
        composer create-project "$$PACKAGE_NAME" "$$TEMP_DIR" $${PACKAGE_VERSION:+"$$PACKAGE_VERSION"} \
          --no-install --no-dev --no-interaction --prefer-dist \
          || fail "composer create-project failed"

        log "step 2/6 configure allow-plugins"
        composer config --no-plugins --working-dir="$$TEMP_DIR" \
          allow-plugins.semitexa/core true \
          || fail "composer config failed"

        # Dev dependencies included: a new project is a working copy, and
        # ai:verify needs phpstan and phpunit from require-dev, or its first
        # run on a fresh install can only answer "incomplete".
        log "step 3/6 install dependencies"
        composer install --working-dir="$$TEMP_DIR" \
          --no-interaction --prefer-dist --optimize-autoloader \
          || fail "composer install failed"

        log "step 4/6 sync project files"
        host_uid="$$(stat -c '%u' "$$TARGET_DIR")"
        host_gid="$$(stat -c '%g' "$$TARGET_DIR")"
        if [ -e "$$COPYING_PATH" ]; then
          log "a copy was cut off midway: copying the skeleton again, the installer's own files left out"
        fi
        # Until the marker is written, a composer.json here is the skeleton's,
        # not a project's: a copy cut off midway is done again on the next start.
        mkdir -p "$$TARGET_DIR/var/install" && : > "$$COPYING_PATH" \
          || fail "cannot mark the copy as in progress"
        # The installer's own files never go through the bulk copy. One the
        # target has stays as it is, an edit made between the tries included:
        # its skeleton copy is dropped. They used to be backed up and put back,
        # and a copy cut off midway left them written over, half written, or
        # from another release for the retry to "restore"
        # (tk-setup-retry-keeps-the-first-backup; review, installer#107).
        # One the target lacks comes from the skeleton under a name of its own
        # and is renamed into place once it is whole. Written by the bulk copy,
        # a cut-off write left half a file, which the retry then kept as the
        # installer's (review, update#110). A link the target has is the
        # target's, even one to a file this container cannot see, such as an
        # .env.default shared between projects (review, ultimate#163).
        for f in .env.default .env .gitignore Dockerfile \
                 docker-compose.yml docker-compose.mysql.yml \
                 docker-compose.redis.yml docker-compose.nats.yml \
                 docker-compose.ollama.yml docker-compose.worker.yml \
                 docker-compose.override.yml.example \
                 bin/semitexa
        do
          rm -f "$$TARGET_DIR/$$f.semitexa-new"
          if [ ! -e "$$TARGET_DIR/$$f" ] && [ ! -L "$$TARGET_DIR/$$f" ] && [ -e "$$TEMP_DIR/$$f" ]; then
            case "$$f" in */*) mkdir -p "$$TARGET_DIR/$${f%/*}" ;; esac
            cp -a "$$TEMP_DIR/$$f" "$$TARGET_DIR/$$f.semitexa-new" \
              && mv -f "$$TARGET_DIR/$$f.semitexa-new" "$$TARGET_DIR/$$f" \
              || fail "copy of $$f into bind mount failed"
          fi
          rm -f "$$TEMP_DIR/$$f"
        done
        cp -a "$$TEMP_DIR/." "$$TARGET_DIR/" || fail "copy into bind mount failed"

        chown -R "$${host_uid}:$${host_gid}" "$$TARGET_DIR/" 2>/dev/null || true
        chmod +x "$$TARGET_DIR/bin/semitexa" 2>/dev/null || true

        log "step 5/6 write success marker"
        write_marker
        rm -f "$$COPYING_PATH"

        # A fresh project is a git repository with one commit, so the first
        # `bin/semitexa ai:verify --dirty` sees the developer's own changes
        # instead of answering "project root not a git repository". Optional:
        # an existing .git is left alone, and a failure here never fails the
        # install (ai:verify still names the root it could not scan).
        log "step 6/6 initial git commit"
        if [ -e "$$TARGET_DIR/.git" ]; then
          log "already a git repository, left untouched"
        elif [ "$${SEMITEXA_GIT_INIT:-1}" = "0" ]; then
          # install.sh sets this when the project sits inside an existing
          # repository, which this container cannot see: a nested .git would
          # turn the project into an embedded repo of the outer one.
          log "SEMITEXA_GIT_INIT=0 (inside an existing repository), skipped"
        elif ! command -v git >/dev/null 2>&1; then
          log "git not available, skipped; run: git init && git add -A && git commit -m 'Initial Semitexa project'"
        elif git -c safe.directory="$$TARGET_DIR" -c init.defaultBranch=main -C "$$TARGET_DIR" init -q \
          && git -c safe.directory="$$TARGET_DIR" -C "$$TARGET_DIR" add -A \
          && git -c safe.directory="$$TARGET_DIR" \
               -c user.name="Semitexa installer" -c user.email="installer@semitexa.invalid" \
               -C "$$TARGET_DIR" commit -q -m "Initial Semitexa project"
        then
          chown -R "$${host_uid}:$${host_gid}" "$$TARGET_DIR/.git" 2>/dev/null || true
          log "initial commit created"
        else
          rm -rf "$$TARGET_DIR/.git"
          log "WARN: initial git commit failed, skipped; run: git init && git add -A && git commit -m 'Initial Semitexa project'"
        fi

        rm -rf "$$TEMP_DIR"
        log "bootstrap complete"
    restart: "no"

  cli:
    build: .
    user: "${SEMITEXA_UID:-1000}:${SEMITEXA_GID:-1000}"
    environment:
      HOME: /var/www/html
      SEMITEXA_AGENTS_DIR: /var/semitexa/agents
      SEMITEXA_HOST_PROJECT_ROOT: ${SEMITEXA_HOST_PROJECT_ROOT:-}
    env_file:
      - path: .env.default
        required: true
      - path: .env
        required: false
    volumes:
      - .:/var/www/html
      - ${SEMITEXA_AGENTS_HOST_DIR:-./var/ai-work/agents}:/var/semitexa/agents
    working_dir: /var/www/html
    command: ["sleep", "infinity"]
    profiles: ["cli"]
    depends_on:
      setup:
        condition: service_completed_successfully
